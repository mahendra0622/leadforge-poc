[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy /api/* to Render backend — must come before the SPA catch-all
[[redirects]]
  from   = "/api/*"
  to     = "https://leadforge-backend-7ru3.onrender.com/api/:splat"
  status = 200
  force  = true

# React Router — serve index.html for all non-API routes
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
